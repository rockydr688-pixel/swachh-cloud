version: '3.8'

services:
  # 1. MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: cloudclean-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=cloudclean
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cloudclean-network

  # 2. Python FastAPI Image Analysis Microservice
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: cloudclean-ai-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - HOST=0.0.0.0
      - AI_SERVICE_SECRET=${AI_SERVICE_SECRET:-cloudclean-ai-internal-key-32chars!}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - cloudclean-network

  # 3. Spring Boot Backend Monolith
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudclean-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/cloudclean
      - AI_SERVICE_URL=http://ai-service:8001
      - AI_SERVICE_SECRET=${AI_SERVICE_SECRET:-cloudclean-ai-internal-key-32chars!}
      - JWT_SECRET=${JWT_SECRET:-cloudclean_super_secure_jwt_secret_key_with_at_least_256_bits_length_for_hmac_sha256!}
      - ENCRYPTION_SECRET=${ENCRYPTION_SECRET:-cloudclean_oauth_token_encryption_key_32chars!}
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:80,http://frontend:80
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-mock-google-client-id.apps.googleusercontent.com}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-mock-google-client-secret}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:3000/oauth/callback}
    depends_on:
      mongodb:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    networks:
      - cloudclean-network

  # 4. React Frontend (Nginx Production Server)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=/api
    container_name: cloudclean-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - cloudclean-network

networks:
  cloudclean-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
