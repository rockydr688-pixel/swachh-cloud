server:
  port: 8000
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

spring:
  application:
    name: cloudclean-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/cloudclean}
      auto-index-creation: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# Security & JWT Configuration
app:
  jwt:
    secret: ${JWT_SECRET:cloudclean_super_secure_jwt_secret_key_with_at_least_256_bits_length_for_hmac_sha256!}
    expiration-ms: 86400000 # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
  encryption:
    secret: ${ENCRYPTION_SECRET:cloudclean_oauth_token_encryption_key_32chars!}

# Swagger OpenAPI Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true

logging:
  level:
    root: INFO
    com.cloudclean: DEBUG
    org.springframework.security: INFO
    org.springframework.data.mongodb.core.MongoTemplate: INFO
